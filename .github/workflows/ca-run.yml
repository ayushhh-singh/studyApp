name: Scheduled — Current affairs pipeline

# Free-tier (₹0 stack) replacement for the `neev-ca-run` Render Cron Job
# defined in render.yaml (kept there, unused, as the paid upgrade path — see
# docs/operations.md's "Upgrading to paid" section). Runs `pnpm ca:run`
# directly on a GitHub-hosted runner instead of a Render container.
#
# GitHub Actions schedule triggers are BEST-EFFORT — expect several minutes
# of drift under GitHub-wide load, never treat this as a precise clock. A
# schedule is also automatically disabled after 60 days with no activity on
# the repo (any push/commit resets that clock) — if this silently stops
# firing, that's almost certainly why; re-enable it from the Actions tab or
# just push a commit.
on:
  schedule:
    # Every 6h, matching the dev scheduler's cadence (src/ca/scheduler.ts) and
    # render.yaml's neev-ca-run job.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # No cancel-in-progress: a slow run finishes rather than getting killed
  # mid-write; the next scheduled tick queues behind it instead of running
  # concurrently over the same rows.
  group: ca-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Was 15 — too tight in practice. Every candidate item (kept AND
    # archived) costs a sequential triage LLM call, and every kept item adds
    # an enrich call plus MCQ/mains-question generation; with max-per-source
    # x 6 sources that can be 100+ sequential Claude/OpenAI round trips in
    # one run. GitHub was hard-cancelling the job mid-run at 15m (confirmed
    # live: a run showed "cancelled ... in 15m 15s"), meaning any sources
    # later in CA_SOURCES than wherever the clock ran out were silently
    # starved every single run. 40 gives real headroom without risking a
    # genuinely-stuck run burning the whole budget unnoticed.
    # +10 on top of that for the ca:embed step below — normally seconds (a
    # no-op when there's no gap), but a large backlog batch under a loaded
    # HNSW index has been observed taking several minutes with retries.
    #
    # Since 2026-07-23 ca:run defaults to submit-now/collect-later triage
    # (Message Batches API, 50% off — see ca/pipeline.ts), so per-run wall time
    # should DROP: the biggest block of sequential calls (one triage per
    # candidate item, kept AND archived) is off the critical path entirely. A
    # run now does at most one collect (enrich + quiz generation for the
    # PREVIOUS run's batch) plus one non-blocking submit. The generous timeout
    # is deliberately left as-is — it is headroom, not a target, and the collect
    # phase is still the sequential enrich/MCQ/mains-question work it always was.
    #
    # ⚑ 2026-08-13: the run budget went 40 -> 70 items (apps/api/src/ca/volume.ts,
    # which carries the full derivation) and CA_SOURCES is now 11 feeds, not the
    # 6 the paragraph above was written against. 50 STILL HOLDS, and this is the
    # arithmetic — do not re-derive it from scratch. Measured on the six real
    # dual-exam runs of 2026-08-11/12: 64-79 critical-path calls, 10.5-12.7 min,
    # one 17.8 min outlier => 0.164 min/call typical, 0.262 worst. Critical-path
    # calls are `maxTotal x 0.60 keep-rate x calls-per-kept-item`, where
    # calls-per-kept-item is 1.9 at ONE live exam and 2.78 at TWO (each extra
    # live exam adds ~0.88, since node-classify and MCQ generation fan out per
    # exam while enrich does not):
    #
    #   maxTotal    2 exams typ/worst    3 exams typ/worst   (+~2 min setup)
    #      40           11 / 18 min          14 / 23 min
    #      70           19 / 31 min          25 / 40 min      <- current
    #     100           27 / 44 min          36 / 58 min      <- exceeds this cap
    #
    # So 70 is the largest budget that survives a worst-rate run AFTER a third
    # exam goes live. RAISE `timeout-minutes` IN THE SAME COMMIT AS ANY FURTHER
    # BUDGET RAISE — and note the other ceiling: max-per-source (15) caps a run
    # at `sum of min(supply, 15)`, measured at 99 items on real feeds, so a
    # budget past ~85 also needs that raised or it silently does nothing.
    #
    # ⚑ 50 -> 75 BECAUSE A RUN COLLECTS **ALL** PENDING BATCHES, NOT ONE. The
    # table above assumes one batch per run; `collectBatch` is called in a loop
    # over `listPendingBatches()`, so when a batch has not finished by the time
    # the next 6h tick submits another, the run after that does BOTH. Measured
    # over 97 real batches: submit->collect p50 5.47h against a 6h cadence, and
    # **1 of 95 collect events (1%) collected 2 batches** (max ever: 2). Rare,
    # but not hypothetical. At 2x70 = 140 items the same arithmetic gives
    # 40 min typical / **63 min worst** at 2 exams and 53 / 83 at 3 — so the
    # OLD 40 budget was safe even on a double-collect (24/37 and 31/49) and 70
    # is not. 75 covers the measured 2-exam worst case with headroom.
    #
    # A 3-exam worst-rate double-collect (83 min) would still be cancelled, and
    # that is accepted rather than chased: it compounds three tail events, and a
    # hard-cancel degrades safely — the pipeline persists item by item, uncollected
    # ledger rows stay `pending` and are retried next run, and an item already
    # persisted re-inserts as a 23505 duplicate (counted `skippedDuplicate`, not
    # a failure). The one real casualty is the `ca:embed` step below, whose
    # `if: !cancelled()` does NOT run on a timeout — nightly-settle's
    # `ca:embed` + `ingest:embed --missing-only` backfills that within a day.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A `schedule:` run always executes the repository's DEFAULT branch — this
      # checkout names no `ref:`. On 2026-08-01 that meant a four-day-stale `main`
      # publishing cross-exam-contaminated content while every run stayed green.
      # Fails loudly when the branch these pipelines run from has stopped moving.
      # See scripts/assert-fresh-checkout.mjs for why the check is commit AGE and
      # not a marker (the workflow and the code come from the same commit, so a
      # marker check is self-consistent and cannot detect staleness).
      # Skipped on workflow_dispatch: there the caller picked the ref, and a manual
      # run from a known-good ref is the recovery path while a merge is decided.
      - name: Stale-checkout guard (a scheduled run executes the default branch)
        if: ${{ github.event_name == 'schedule' }}
        run: node scripts/assert-fresh-checkout.mjs

      - name: Install dependencies (api + its workspace deps only)
        run: pnpm install --frozen-lockfile --filter api...

      - name: Run ca:run
        run: pnpm --filter api ca:run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # ca:run's own inline embed step only LOGS a failure and never retries
      # (see pipeline.ts) — this closes any item that slipped through that
      # silent path, plus anything approved via the Review Queue since the
      # last run. --missing-only is cheap: it's a no-op unless there's a
      # real gap. See CLAUDE.md's "Embeddings MUST stay in sync" rule.
      # `if: !cancelled()` — ca:run processes items one at a time (a single
      # item's failure is already caught and skipped inside the pipeline, see
      # its "ITEM FAILED, skipping" log), so a partial/crashed ca:run can
      # still have committed several published items before failing. Without
      # this, the default GitHub Actions behavior (stop at the first failed
      # step) would skip this backfill entirely on any ca:run hiccup, leaving
      # whatever DID get published sitting un-embedded until the next
      # scheduled run picks it up. Runs unless the workflow itself was
      # explicitly cancelled (not just "the previous step failed").
      - name: Run ca:embed (backfill any item ca:run's inline embed missed)
        if: ${{ !cancelled() }}
        run: pnpm --filter api ca:embed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
