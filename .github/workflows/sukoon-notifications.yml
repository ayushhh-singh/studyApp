name: Scheduled — Sukoon reminders

# Sukoon's own reminder cron (blueprint F11): mood check-in (user's own
# reminder_time), journey-step reminder (8pm IST, only if today's step on a
# started journey is still open), and the exam-eve support ping (7pm IST, the
# evening before profile.exam_date). Runs `pnpm sukoon:notifications:run`,
# which hard-skips sending anything during quiet hours (11pm–7am IST) — see
# apps/api/src/sukoon/services/reminders.ts.
#
# Deliberately its OWN workflow, not folded into notifications.yml: Sukoon's
# user set (sukoon_profiles) and reminder rules are entirely independent of
# Neev's notification_schedule/generateForUser, and this module must stay
# mountable/extractable on its own (CLAUDE.md's Sukoon isolation rules).
#
# GitHub Actions schedule triggers are BEST-EFFORT (minutes of drift is
# normal) and are auto-disabled after 60 days of repo inactivity — any
# push/commit resets that clock.
on:
  schedule:
    # Hourly — matches notifications.yml's own cadence and rationale: an
    # arbitrary user-chosen reminder_time plus two fixed evening pings only
    # ever need an hour's slack, never a per-minute clock.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sukoon-notifications
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (api + its workspace deps only)
        run: pnpm install --frozen-lockfile --filter api...

      - name: Run sukoon:notifications:run
        run: pnpm --filter api sukoon:notifications:run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
