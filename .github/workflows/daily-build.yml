name: Scheduled — Daily quiz build

# Free-tier (₹0 stack) replacement for the `neev-daily-build` Render Cron
# Job in render.yaml (kept there, unused, as the paid upgrade path — see
# docs/operations.md's "Upgrading to paid" section).
#
# GitHub Actions schedule triggers are BEST-EFFORT (minutes of drift is
# normal) and are auto-disabled after 60 days of repo inactivity — any
# push/commit resets that clock.
on:
  schedule:
    # 23:30 UTC (previous day) = 05:00 IST — matches render.yaml's
    # neev-daily-build job exactly.
    - cron: "30 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A `schedule:` run always executes the repository's DEFAULT branch — this
      # checkout names no `ref:`. On 2026-08-01 that meant a four-day-stale `main`
      # publishing cross-exam-contaminated content while every run stayed green.
      # Fails loudly when the branch these pipelines run from has stopped moving.
      # See scripts/assert-fresh-checkout.mjs for why the check is commit AGE and
      # not a marker (the workflow and the code come from the same commit, so a
      # marker check is self-consistent and cannot detect staleness).
      # Skipped on workflow_dispatch: there the caller picked the ref, and a manual
      # run from a known-good ref is the recovery path while a merge is decided.
      - name: Stale-checkout guard (a scheduled run executes the default branch)
        if: ${{ github.event_name == 'schedule' }}
        run: node scripts/assert-fresh-checkout.mjs

      - name: Install dependencies (api + its workspace deps only)
        run: pnpm install --frozen-lockfile --filter api...

      - name: Run daily:build
        run: pnpm --filter api daily:build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
