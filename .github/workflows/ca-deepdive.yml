name: Scheduled — Magazine deep dives (monthly)

# Generates the five monthly Deep Dives for the Mains Analysis magazine edition
# (`pnpm ca:deepdive --previous --run` → apps/api/src/ca/deepdive.ts), for the
# most recent FULLY ELAPSED IST calendar month.
#
# WHY THIS DID NOT EXIST BEFORE: deepdive.ts's own docstring already described
# itself as "a scheduled monthly job (pnpm ca:deepdive)" — but no schedule for it
# existed anywhere (not here, not in render.yaml, not in the dev scheduler
# src/ca/scheduler.ts, which only ticks the 6h pipeline and the weekly assembly).
# Deep dives had only ever been generated by hand, which is why a month can sit
# with zero of them indefinitely.
#
# THIS IS THE ONLY GENERATIVE STEP IN THE MAGAZINE, and that is the whole reason
# it is the only part that needs a schedule. Both editions (Prelims Compendium +
# Mains Analysis) are computed ON DEMAND by services/magazine.ts at request time
# — pure assembly over already-published rows, no table, no cron, and already
# scoped to an exact calendar month via lib/month.ts's `monthBounds`
# (`[YYYY-MM-01, next-month-01)`). Nothing else here needs to be "regenerated"
# monthly, and there is no rolling-window query to convert.
#
# NOT to be confused with ca-run.yml, which is the CA triage/enrichment pipeline
# and MUST stay on its 6h cadence — it is what keeps current_affairs_items fed
# for the daily quiz and the mentor's RAG grounding. This job only synthesises
# long-form analysis over what that pipeline has already published.
#
# COST: ~$0.15/run (5 sonnet calls via the Message Batches API at its 50%
# discount — see deepdive.ts's `planDeepDives` estimate, confirmed by a real dry
# run against July 2026: $0.1537).
#
# Output lands as `magazine_deep_dives.status = 'needs_review'` — a human still
# approves each one in the admin Review Queue's Magazine tab before it appears in
# a Mains Analysis edition. A re-run clears that month's not-yet-published drafts
# first and never touches ones a reviewer already published, so re-running by
# hand (workflow_dispatch) is safe if a late item should have made the top five.
#
# See ca-run.yml for the GitHub Actions schedule caveats (best-effort timing,
# auto-disabled after 60 days of repo inactivity).
on:
  schedule:
    # 02:30 UTC on the 1st = 08:00 IST on the 1st.
    #
    # TIMED TO LAND AFTER THE PRIOR MONTH IS FULLY PUBLISHED, not merely after
    # midnight. ca:run has used submit-now/collect-later batch triage since
    # 2026-07-23, so an item is SUBMITTED by one 6-hourly run and only PUBLISHED
    # by the next. The prior month's last run fires 18:00 UTC on its final day
    # (23:30 IST); the 00:00 UTC run on the 1st is what collects, enriches and
    # publishes that batch, and it may take up to its own 50-minute timeout. This
    # leaves ~1h40m of margin past that window before ranking the month.
    - cron: "30 2 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # No cancel-in-progress: a batch poll finishes rather than getting killed
  # mid-write, which would leave the month's drafts cleared but not regenerated.
  group: ca-deepdive
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Matches ca-verify-mcqs.yml, the other Batch-API job. The Message Batches
    # API's guarantee is 24h; in practice these return in minutes, but the poll
    # loop needs real headroom rather than a tight bound.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A `schedule:` run always executes the repository's DEFAULT branch — this
      # checkout names no `ref:`. On 2026-08-01 that meant a four-day-stale `main`
      # publishing cross-exam-contaminated content while every run stayed green.
      # Fails loudly when the branch these pipelines run from has stopped moving.
      # See scripts/assert-fresh-checkout.mjs for why the check is commit AGE and
      # not a marker (the workflow and the code come from the same commit, so a
      # marker check is self-consistent and cannot detect staleness).
      # Skipped on workflow_dispatch: there the caller picked the ref, and a manual
      # run from a known-good ref is the recovery path while a merge is decided.
      - name: Stale-checkout guard (a scheduled run executes the default branch)
        if: ${{ github.event_name == 'schedule' }}
        run: node scripts/assert-fresh-checkout.mjs

      - name: Install dependencies (api + its workspace deps only)
        run: pnpm install --frozen-lockfile --filter api...

      # `--previous` resolves the month IN CODE (lib/month.ts's previousIstMonth)
      # rather than here. A shell `date -u +%Y-%m` would be UTC — this repo is IST
      # throughout and `current_affairs_items.date` is `istDateString(pubDate)` —
      # and would also name the CURRENT month, which on the 1st has barely begun.
      - name: Run ca:deepdive for the previous calendar month
        run: pnpm --filter api ca:deepdive --previous --run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Deep-dive context is RAG-grounded (deepdive.ts → retrieveGrounding),
          # which embeds the issue text via lib/embeddings.ts. Grounding degrades
          # gracefully on error, so a missing key would silently produce thinner,
          # ungrounded analysis rather than failing the run.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
