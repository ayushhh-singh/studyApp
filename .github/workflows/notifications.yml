name: Scheduled — Notifications

# Free-tier (₹0 stack) replacement for the `neev-notifications` Render
# Cron Job in render.yaml (kept there, unused, as the paid upgrade path — see
# docs/operations.md's "Upgrading to paid" section). Runs
# `pnpm notifications:run`: (re)generates/resolves each user's
# notification_schedule rows, then drains them through the web-push sender
# (quiz-ready 5AM, SRS 7AM, streak-at-risk ~8PM IST).
#
# GitHub Actions schedule triggers are BEST-EFFORT (minutes of drift is
# normal) and are auto-disabled after 60 days of repo inactivity — any
# push/commit resets that clock.
on:
  schedule:
    # Hourly, matching the in-app bell's own hourly self-heal and
    # render.yaml's neev-notifications job.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A `schedule:` run always executes the repository's DEFAULT branch — this
      # checkout names no `ref:`. On 2026-08-01 that meant a four-day-stale `main`
      # publishing cross-exam-contaminated content while every run stayed green.
      # Fails loudly when the branch these pipelines run from has stopped moving.
      # See scripts/assert-fresh-checkout.mjs for why the check is commit AGE and
      # not a marker (the workflow and the code come from the same commit, so a
      # marker check is self-consistent and cannot detect staleness).
      # Skipped on workflow_dispatch: there the caller picked the ref, and a manual
      # run from a known-good ref is the recovery path while a merge is decided.
      - name: Stale-checkout guard (a scheduled run executes the default branch)
        if: ${{ github.event_name == 'schedule' }}
        run: node scripts/assert-fresh-checkout.mjs

      - name: Install dependencies (api + its workspace deps only)
        run: pnpm install --frozen-lockfile --filter api...

      - name: Run notifications:run
        run: pnpm --filter api notifications:run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
