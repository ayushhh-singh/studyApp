name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fast, dependency-free guard: fail before install if any committed file
      # carries a hardcoded machine-specific absolute path (a /Users or /home
      # home dir, a Windows drive path, etc). See docs/operations.md → "Portability guard".
      - name: Portability guard (no hardcoded local paths)
        run: node scripts/check-portable-paths.mjs

      # Fails if a CLI parses process.argv itself instead of using the shared,
      # schema-validated parseArgs. A permissive parser silently dropped a
      # --dry-run and ran a billed, DB-writing pass against production on
      # 2026-07-31 (docs/OUTSTANDING.md §0d); the repo had SIX hand-rolled
      # dialects at the time. This stops a seventh appearing.
      - name: CLI-argument guard (no hand-rolled argv parsing)
        run: node scripts/check-cli-args.mjs

      # Keeps robots.txt, sitemap.xml and scripts/prerender.mjs in agreement.
      # robots is a blanket `Disallow: /` plus an exact allow-list, so a new
      # public page reaches the sitemap and the prerenderer while staying blocked
      # to crawlers — which is what happened to /resources and /contact, and
      # (because the SITE ROOT was blocked, so Google could never read the home
      # page's <link rel="icon">) is why the app's logo was missing beside the
      # site in search results. Both failures are silent: the build stays green
      # and the pages render fine. Dependency-free, so it runs before install.
      - name: SEO guard (robots / sitemap / prerender agree)
        run: node apps/web/scripts/check-seo.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Typecheck + build web
        run: pnpm --filter web build

      - name: Lint web
        run: pnpm --filter web lint

      - name: Build API (tsc, catches emit-time errors alongside typecheck)
        run: pnpm --filter api build
