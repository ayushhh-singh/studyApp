name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Fast, dependency-free guard: fail before install if any committed file
      # carries a hardcoded machine-specific absolute path (a /Users or /home
      # home dir, a Windows drive path, etc). See docs/operations.md → "Portability guard".
      - name: Portability guard (no hardcoded local paths)
        run: node scripts/check-portable-paths.mjs

      # Fast, dependency-free guard: fail before install if Sukoon copy/prompts/
      # i18n drift into clinical language (SUKOON_CONTEXT hard rule; blueprint
      # risk #2). Negation-aware — disclaimers ("does not diagnose") are fine.
      - name: Sukoon clinical-language guard
        run: node scripts/check-sukoon-clinical-words.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter api typecheck

      # Safety-critical: the Sukoon crisis detector's deterministic keyword layer
      # must pass its adversarial red-team suite (blueprint F3) on every PR. Pure,
      # no DB/model/env — the classifier (--live) pass is deliberately excluded.
      - name: Crisis red-team suite (Sukoon F3)
        run: pnpm --filter api test:crisis

      - name: Typecheck + build web
        run: pnpm --filter web build

      - name: Lint web
        run: pnpm --filter web lint

      - name: Build API (tsc, catches emit-time errors alongside typecheck)
        run: pnpm --filter api build
